<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All-In-One Super Fast Media Downloader</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:#0f172a;color:#fff;margin:0;padding:15px;display:flex;justify-content:center;align-items:center;min-height:100vh}
.container{background:#1e293b;padding:25px;border-radius:16px;max-width:500px;width:100%;box-shadow:0 10px 25px rgba(0,0,0,.5);text-align:center}
h1{color:#38bdf8;margin:0 0 5px;font-size:22px}p.sub{color:#94a3b8;font-size:13px;margin:0 0 20px}
.input-group{display:flex;gap:8px;margin-bottom:15px}
input{flex:1;min-width:0;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px;outline:none}
input:focus{border-color:#38bdf8}
button{background:#0284c7;color:#fff;border:none;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.loader{display:none;color:#38bdf8;margin:15px 0;font-size:14px}
.err{display:none;background:#451a1a;color:#fecaca;border-radius:8px;padding:10px;font-size:13px;margin-bottom:12px;text-align:left}
.result-card{display:none;text-align:left;margin-top:15px}
video{width:100%;border-radius:10px;max-height:280px;background:#000;margin-bottom:12px}
h3{font-size:15px;margin:0 0 12px;color:#f1f5f9;line-height:1.4;word-break:break-word}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}
.info-box{background:#0f172a;padding:10px;border-radius:8px;border:1px solid #334155;font-size:12px;color:#94a3b8}
.info-box span{display:block;color:#fff;font-weight:bold;font-size:13px;margin-top:2px;word-break:break-word}
.action-btn{display:block;width:100%;background:#e11d48;color:#fff;text-align:center;padding:12px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:8px;cursor:pointer}
.alt{background:#be123c}.audio-btn{background:#4f46e5}.reset-btn{background:#334155}
.note{font-size:11px;color:#94a3b8;margin-top:6px}
</style>
</head>
<body>
<div class="container">
  <h1>All-In-One Downloader</h1>
  <p class="sub">TikTok, Insta, FB, YouTube, X, Reddit, Pinterest, Snapchat, Threads &amp; Vimeo</p>
  <div class="input-group">
    <input type="text" id="mediaUrl" placeholder="Yahan link paste karein..." autocomplete="off" />
    <button id="goBtn">Fetch</button>
  </div>
  <div class="loader" id="loader"></div>
  <div class="err" id="err"></div>
  <div class="result-card" id="resultCard">
    <video id="videoPlayer" controls playsinline preload="metadata"></video>
    <h3 id="title"></h3>
    <div class="info-grid">
      <div class="info-box">Creator <span id="creator">-</span></div>
      <div class="info-box">Platform <span id="source">-</span></div>
      <div class="info-box">Duration <span id="duration">-</span></div>
      <div class="info-box">Views <span id="views">-</span></div>
    </div>
    <a id="downloadVideoBtn" class="action-btn" href="#">Download Video ⬇</a>
    <div id="moreFormats"></div>
    <a id="downloadAudioBtn" class="action-btn audio-btn" href="#" style="display:none">Download Audio ♫</a>
    <a class="action-btn reset-btn" id="resetBtn">Download Another</a>
  </div>
</div>
<script>
const API = "https://all-in-one-media-downloader-hwae.onrender.com";   // <- apna Render URL
const $ = id => document.getElementById(id);
let busy = false;

// 1) Server ko pehle se jaga do (cold start isi dauran guzar jata hai) + jab tak page khula ho jaga rakho
const ping = () => fetch(API + "/health", { cache: "no-store" }).catch(() => {});
ping(); setInterval(ping, 4 * 60 * 1000);

function showErr(m) { const e = $("err"); e.textContent = m; e.style.display = m ? "block" : "none"; }
function mb(n) { return n ? " · " + (n / 1048576).toFixed(1) + " MB" : ""; }

async function fetchMedia() {
  if (busy) return;
  const url = $("mediaUrl").value.trim();
  if (!url) return showErr("Pehle koi valid link paste karein!");
  busy = true; $("goBtn").disabled = true; showErr(""); $("resultCard").style.display = "none";
  const loader = $("loader"); loader.style.display = "block"; loader.textContent = "⚡ Details nikal rahe hain...";
  const slow = setTimeout(() => loader.textContent = "⏳ Server jaag raha hai, 20-40 second lag sakte hain...", 4000);
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 70000);
  try {
    const r = await fetch(API + "/api/download", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }), signal: ctrl.signal });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.error) { showErr((d.error || "Server error") + (d.hint ? "  (" + d.hint + ")" : "")); return; }

    $("title").textContent = d.title; $("creator").textContent = d.uploader; $("source").textContent = d.source || "-";
    $("duration").textContent = d.duration; $("views").textContent = d.view_count;
    const v = $("videoPlayer"); v.poster = d.thumbnail || ""; v.removeAttribute("src");
    if (d.videoUrl) v.src = d.videoUrl;
    v.style.display = d.videoUrl ? "block" : "none";

    const main = $("downloadVideoBtn");
    if (d.downloadUrl) { main.href = d.downloadUrl; main.style.display = "block"; } else main.style.display = "none";

    const more = $("moreFormats"); more.textContent = "";
    (d.formats || []).forEach(f => {
      const a = document.createElement("a"); a.className = "action-btn alt"; a.href = f.url;
      a.textContent = "Download " + f.quality + mb(f.size) + " ⬇"; more.appendChild(a);
      if (f.kind === "merge") { const n = document.createElement("div"); n.className = "note"; n.textContent = "HD merge hoti hai, download shuru hone mein thora waqt lagega."; more.appendChild(n); }
    });

    const au = $("downloadAudioBtn");
    if (d.audioUrl) { au.href = d.audioUrl; au.style.display = "block"; } else au.style.display = "none";
    $("resultCard").style.display = "block";
  } catch (e) {
    showErr(e.name === "AbortError" ? "Server ne jawab nahi diya. Dobara try karein." : "Connection error! Dobara try karein.");
  } finally { clearTimeout(slow); clearTimeout(to); loader.style.display = "none"; busy = false; $("goBtn").disabled = false; }
}
$("goBtn").onclick = fetchMedia;
$("mediaUrl").addEventListener("keydown", e => { if (e.key === "Enter") fetchMedia(); });
$("resetBtn").onclick = () => { $("mediaUrl").value = ""; $("resultCard").style.display = "none"; $("videoPlayer").pause(); showErr(""); };
</script>
</body>
</html>
